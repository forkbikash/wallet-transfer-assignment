name: sonarqube

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    # Skip on forks that don't have SONAR_TOKEN configured — without it the
    # action errors out with a non-actionable failure. Always runs on the
    # repository's own pushes/PRs.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # `go test -race` requires cgo.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar needs full history for accurate "new code" blame on PRs.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests with coverage
        # The coverage profile is consumed by Sonar via
        # sonar.go.coverage.reportPaths in sonar-project.properties.
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
