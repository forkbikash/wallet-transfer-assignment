name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $HOME/.local/bin v2.5.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run lint
        run: make lint

      - name: Run format check
        run: make fmt-check

      - name: Run tests
        run: make test
