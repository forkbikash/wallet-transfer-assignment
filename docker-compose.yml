services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data

  # Single-broker Kafka in KRaft mode (no Zookeeper). In production this is a
  # 3-broker cluster with replication-factor=3 and min.insync.replicas=2 — that
  # replication is what makes the event log durable (it replaces the chapter's
  # Raft). Locally one broker (RF=1) keeps the stack small.
  kafka:
    image: apache/kafka:3.7.0
    container_name: wallet-kafka
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9094:9094" # host access (KAFKA_BROKERS=localhost:9094)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot: apply migrations, then exit. The wallet services wait for this to
  # complete successfully.
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: wallet-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migration:/migrations:ro
    command:
      ["-path=/migrations", "-database=postgres://wallet:${POSTGRES_PASSWORD:-wallet}@postgres:5432/wallet?sslmode=disable", "up"]

  # The four roles, all from the same image (see Dockerfile), differing only by
  # --mode. They share Kafka + Postgres. The gateway exposes the HTTP API.
  gateway:
    build: .
    container_name: wallet-gateway
    command: ["--mode=gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: &wallet_env
      PORT: "8080"
      DATABASE_URL: "postgres://wallet:${POSTGRES_PASSWORD:-wallet}@postgres:5432/wallet?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_PARTITIONS: "12"
      KAFKA_REPLICATION_FACTOR: "1"
      LOG_JSON: "true"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"

  # The workers below are STATELESS and safe to scale, e.g.:
  #   docker compose up -d --scale command-processor=3 --scale saga=2
  # (no container_name, so Compose can run multiple replicas). In production each
  # is a Deployment with N replicas; correctness comes from the per-account DB
  # row lock + saga CAS, not from instance count.
  command-processor:
    build: .
    command: ["--mode=command-processor"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *wallet_env

  projector:
    build: .
    command: ["--mode=projector"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *wallet_env

  saga:
    build: .
    command: ["--mode=saga"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *wallet_env

volumes:
  wallet_pgdata:
