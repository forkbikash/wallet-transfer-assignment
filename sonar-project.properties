# SonarCloud configuration.
sonar.projectKey=forkbikash_wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.organization=forkbikash
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/tests/**
sonar.exclusions=**/.git/**,**/.github/**,**/vendor/**,**/node_modules/**,**/coverage/**,**/bin/**,**/dist/**,**/*_test.go,**/tests/**

# Disable the PL/SQL analyzer. Our migrations are PostgreSQL, not Oracle PL/SQL —
# leaving the analyzer on flags `VARCHAR` (rule plsql:VarcharUsageCheck) and
# `<column> = NULL` (plsql:NullComparison) as bugs even though both are correct
# Postgres syntax.
sonar.lang.patterns.plsql=

# Suppress godre:S8196 ("rename single-method interface to follow Go convention")
# inside the iface dirs. The codebase uses the `<Name>Iface` suffix consistently
# for both single-method and multi-method interfaces; mixing two naming styles
# would be worse than the rule it's trying to enforce.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e1.resourceKey=**/iface/**
sonar.issue.ignore.multicriteria.e2.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e2.resourceKey=**/ifaces/**
