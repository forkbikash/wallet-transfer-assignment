# SonarCloud configuration.
sonar.projectKey=forkbikash_wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.organization=forkbikash
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/tests/**
sonar.exclusions=**/.git/**,**/.github/**,**/vendor/**,**/node_modules/**,**/coverage/**,**/bin/**,**/dist/**,**/*_test.go,**/tests/**

# Issue suppressions:
#   e1, e2 — godre:S8196 ("rename single-method interface to follow Go
#     conventions") inside the iface dirs. The codebase uses the `<Name>Iface`
#     suffix consistently for both single- and multi-method interfaces; mixing
#     two naming styles would be worse than the rule it would satisfy.
#   e3      — plsql:* rules on *.sql files. Our migrations are PostgreSQL,
#     not Oracle PL/SQL — `VARCHAR` and `<column> = NULL` are correct Postgres
#     syntax but the PL/SQL analyzer flags them as bugs/code-smells.
#   e4      — secrets:S6698 on docker-compose.yml. The default `wallet`
#     password is a dev-only fallback used by `make compose-up`; production
#     deploys are expected to override `POSTGRES_PASSWORD` via env.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e1.resourceKey=**/iface/**
sonar.issue.ignore.multicriteria.e2.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e2.resourceKey=**/ifaces/**
sonar.issue.ignore.multicriteria.e3.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.e4.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e4.resourceKey=docker-compose.yml
